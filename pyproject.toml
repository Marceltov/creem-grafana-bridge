[project]
name = "creem-grafana-bridge"
version = "0.1.0"
description = "Revenue, cashflow, forecast and payout series from Creem stores, for Grafana"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creem_bridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
